<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="">
  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#512BD4"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#512BD4" stop-opacity="0.35"/><stop offset="1" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="160" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="0.75" stop-color="#120e2e"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="160" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .code { font-size: 14px; fill: #8b9cff; opacity: 0; animation: drift 9s linear infinite; }
    .code.b { fill: #5cc8ff; }
    .trace { fill: none; stroke: #2b2f5a; stroke-width: 2; }
    .run { fill: none; stroke: url(#pulse); stroke-width: 2.5; stroke-linecap: round;
           stroke-dasharray: 60 1400; stroke-dashoffset: 1460; animation: run 5s linear infinite; }
    .node { fill: #7C5CFF; animation: blink 2.4s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    .wave { animation: flow linear infinite; }
    .mark { font-size: 22px; font-weight: 700; fill: #7C5CFF; animation: blink 3s ease-in-out infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes drift { 0% { opacity: 0; transform: translateY(8px); }
                       20% { opacity: 0.55; } 80% { opacity: 0.55; }
                       100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes cursor { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <g transform="translate(0 160) scale(1 -1)">
    <g class="wave" style="animation-duration:20s"><path d="M0 60 V132 Q150 114 300 132 T600 132 T900 132 T1200 132 T1500 132 T1800 132 T2100 132 T2400 132 V60 Z" fill="url(#waveA)" fill-opacity="0.55"/></g>
    <g class="wave" style="animation-duration:15s"><path d="M0 60 V118 Q100 103 200 118 T400 118 T600 118 T800 118 T1000 118 T1200 118 T1400 118 T1600 118 T1800 118 T2000 118 T2200 118 T2400 118 V60 Z" fill="url(#waveB)" fill-opacity="0.65"/></g>
    </g>
    <rect y="70" width="1200" height="90" fill="url(#bg)"/>
    <g transform="translate(0 160) scale(1 -1)">
    <g class="wave" style="animation-duration:11s"><path d="M0 88 V104 Q150 92 300 104 T600 104 T900 104 T1200 104 T1500 104 T1800 104 T2100 104 T2400 104 V88 Z" fill="#120e2e" fill-opacity="1"/></g>
    </g>
    <rect y="70" width="1200" height="90" fill="url(#grid)"/>

    <path class="trace" d="M0 102 H230 L256 128 H500"/>
    <path class="trace" d="M1200 128 H970 L944 102 H700"/>
    <path class="run" style="animation-delay:0s" d="M0 102 H230 L256 128 H500"/>
    <path class="run" style="animation-delay:-3s" d="M1200 128 H970 L944 102 H700"/>
    <g filter="url(#glow)">
      <circle class="node" style="animation-delay:0s" cx="500" cy="128" r="4"/>
      <circle class="node" style="animation-delay:-1.5s" cx="700" cy="102" r="4"/>
    </g>

    <text class="mono mark" x="600" y="123" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
