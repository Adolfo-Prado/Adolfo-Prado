<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Adolfo Prado · Desarrollador full-stack · Blazor / .NET">
  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#512BD4"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#512BD4" stop-opacity="0.35"/><stop offset="1" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="0.75" stop-color="#120e2e"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .code { font-size: 14px; fill: #8b9cff; opacity: 0; animation: drift 9s linear infinite; }
    .code.b { fill: #5cc8ff; }
    .trace { fill: none; stroke: #2b2f5a; stroke-width: 2; }
    .run { fill: none; stroke: url(#pulse); stroke-width: 2.5; stroke-linecap: round;
           stroke-dasharray: 60 1400; stroke-dashoffset: 1460; animation: run 5s linear infinite; }
    .node { fill: #7C5CFF; animation: blink 2.4s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    .wave { animation: flow linear infinite; }
    .mark { font-size: 22px; font-weight: 700; fill: #7C5CFF; animation: blink 3s ease-in-out infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes drift { 0% { opacity: 0; transform: translateY(8px); }
                       20% { opacity: 0.55; } 80% { opacity: 0.55; }
                       100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes cursor { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <g class="wave" style="animation-duration:22s"><path d="M0 160 V264 Q150 242 300 264 T600 264 T900 264 T1200 264 T1500 264 T1800 264 T2100 264 T2400 264 V160 Z" fill="url(#waveA)" fill-opacity="0.55"/></g>
    <g class="wave" style="animation-duration:16s"><path d="M0 160 V248 Q100 230 200 248 T400 248 T600 248 T800 248 T1000 248 T1200 248 T1400 248 T1600 248 T1800 248 T2000 248 T2200 248 T2400 248 V160 Z" fill="url(#waveB)" fill-opacity="0.65"/></g>
    <rect width="1200" height="200" fill="url(#bg)"/>
    <g class="wave" style="animation-duration:12s"><path d="M0 198 V232 Q150 218 300 232 T600 232 T900 232 T1200 232 T1500 232 T1800 232 T2100 232 T2400 232 V198 Z" fill="#120e2e" fill-opacity="1"/></g>
    <rect width="1200" height="200" fill="url(#grid)"/>
    <ellipse cx="600" cy="130" rx="420" ry="130" fill="url(#halo)"/>

    <path class="trace" d="M0 34 H170 L200 64 H320"/>
    <path class="trace" d="M1200 40 H1040 L1010 70 H890"/>
    <path class="trace" d="M420 0 V16 L444 40 H560"/>
    <path class="trace" d="M0 214 H90 L118 188 H230"/>
    <path class="trace" d="M1200 214 H1110 L1082 188 H970"/>
    <path class="run" style="animation-delay:0s" d="M0 34 H170 L200 64 H320"/>
    <path class="run" style="animation-delay:-3.1s" d="M1200 40 H1040 L1010 70 H890"/>
    <path class="run" style="animation-delay:-2.4s" d="M420 0 V16 L444 40 H560"/>
    <path class="run" style="animation-delay:-1.6s" d="M0 214 H90 L118 188 H230"/>
    <path class="run" style="animation-delay:-0.8s" d="M1200 214 H1110 L1082 188 H970"/>
    <g filter="url(#glow)">
      <circle class="node" style="animation-delay:0s" cx="320" cy="64" r="4"/>
      <circle class="node" style="animation-delay:-1.55s" cx="890" cy="70" r="4"/>
      <circle class="node" style="animation-delay:-1.2s" cx="560" cy="40" r="4"/>
      <circle class="node" style="animation-delay:-0.8s" cx="230" cy="188" r="4"/>
      <circle class="node" style="animation-delay:-0.4s" cx="970" cy="188" r="4"/>
    </g>

    <g class="mono">
      <text class="code"   x="40"  y="104" style="animation-delay:0s">@page "/pedidos"</text>
      <text class="code b" x="40"  y="136" style="animation-delay:-3s">await col.Find(f).ToListAsync();</text>
      <text class="code"   x="40"  y="168" style="animation-delay:-6s">builder.Services.AddRazorComponents();</text>
      <text class="code b" x="1160" y="104" text-anchor="end" style="animation-delay:-1.5s">@app.post("/licitaciones")</text>
      <text class="code"   x="1160" y="136" text-anchor="end" style="animation-delay:-4.5s">fun main() = runBlocking { }</text>
      <text class="code b" x="1160" y="168" text-anchor="end" style="animation-delay:-7.5s">Widget build(BuildContext ctx)</text>
    </g>

    <g text-anchor="middle">
      <text class="mono" x="600" y="128" font-size="54" font-weight="700" fill="#ffffff">
        <tspan fill="#7C5CFF">&lt;</tspan>Adolfo Prado<tspan fill="#7C5CFF"> /&gt;</tspan>
      </text>
      <text class="mono" x="600" y="170" font-size="19" fill="#b8c0ff">
        Desarrollador full-stack · Blazor / .NET<tspan class="cursor" fill="#38BDF8">_</tspan>
      </text>
    </g>
  </g>
</svg>
